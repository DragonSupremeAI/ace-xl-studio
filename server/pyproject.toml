[project]
name = "acestudio-proxy"
version = "0.1.0"
description = "Local proxy + library for the ace-xl-studio UI, forwarding to a remote ACE-Step API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
]

[project.scripts]
acestudio = "acestudio_proxy.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acestudio_proxy"]
